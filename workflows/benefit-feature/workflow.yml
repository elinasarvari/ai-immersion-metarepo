schema_version: "1.0"
workflow:
  id: "benefit-feature"
  name: "Benefits Case feature"
  version: "0.9.0"
  author: "ai-immersion-metarepo"
  description: >-
    From an existing spec to draft PRs, each AI step a separate agent: spec clarifier answers open spec
    questions → architect plan → decision-maker settles open ADRs → tasks → quality engineer's test plan and QA
    tasks → contracts → merge main if it moved → lanes and the QA tests in parallel → verify loop (fixers, one per
    repo where they can → tests, builds and script checks in the background while the reviews run, only where
    something changed) → draft PRs → GitHub Actions. People are asked only when automation can't decide.

requires:
  speckit_version: ">=1.0.0"
  integrations:
    any: ["claude"]

inputs:
  feature:
    type: string
    required: true
    prompt: "Spec to build: its number (e.g. 003) or folder (specs/003-name)"
  integration: {type: string, default: "auto"}
  trace_mode:
    type: string
    default: "strict"
    prompt: "strict = fail if a planned test is missing; warn = report only"
  # Models per step: judgement (plan, decisions, test design, reviews) vs following a written plan (tasks,
  # code, fixes, PRs). Any value `claude --model` accepts: an alias (opus, sonnet) or a full model ID.
  judgement_model: {type: string, default: "opus"}
  coding_model: {type: string, default: "sonnet"}
  review_mode:
    type: string
    default: "parallel"
    prompt: "parallel = reviews run while the tests do, so one fix handles both (faster, more review tokens on red rounds); on_green = reviews only once the tests pass"
  # Answer to the spec gate for runs without a terminal; set only on resume, after a person decided.
  spec_verdict: {type: string, default: ""}

# Run:     workflows/benefit-feature/run.sh start 003 (never the engine directly)
# One way: agents answer open spec questions and decide open ADRs (each listed in the PR for review), and once
#          everything passes the run pushes the feature branch, opens draft PRs, fixes CI and marks them ready.
#          Starting a run is the approval to push. A person is asked only when the spec clarifier leaves a question
#          only a person can answer, or the decision-maker finds no compliant option.
# Checks:  one `wf.py` gate after each planning stage; every check on the code runs inside the verify loop, so
#          the fix step can repair it. A failed gate stops the run: fix, then `specify workflow resume <id>`.
# AI steps: each one is a separate agent session (agents/). 5 fixed (architect, tasks, quality engineer, contracts,
#           PR) + the spec clarifier if the spec has open questions + the decision-maker if an ADR is open (+ an
#           architect update if it chose differently) + the integrator if main moved + 1 per lane + the qa item
#           (+ the QA step if it left work) + per verify round: the reviews that need rerunning and one fixer per
#           repo (or one for everything).

steps:
  # ── 1. Pick up the spec ───────────────────────────────────────────────────────────────────────────
  - id: sync
    type: shell
    run: "skills/sync-repos/sync-repos.sh"
    timeout: 300

  - id: feature
    type: shell
    run: "python3 workflows/benefit-feature/scripts/wf.py prepare {{ inputs.feature }} {{ inputs.trace_mode }}"
    output_format: json

  # Open [NEEDS CLARIFICATION] questions: the spec clarifier answers them, each recorded for review in the PR;
  # a person is asked only for what it couldn't answer safely.
  - id: spec_questions
    type: if
    condition: "{{ steps.feature.output.data.open > 0 }}"
    then:
      - id: spec_clarifier
        type: prompt
        integration: "{{ inputs.integration }}"
        model: "{{ inputs.judgement_model }}"
        timeout: 1200
        prompt: >-
          You are the spec-clarifier agent (agents/spec-clarifier.agent.md). Answer the open [NEEDS CLARIFICATION]
          questions in {{ steps.feature.output.data.spec_file }} and record them as it says. Reply in ≤10 lines.

  - id: spec_check
    type: shell
    run: "python3 workflows/benefit-feature/scripts/wf.py clarify-gate {{ steps.feature.output.data.feature_dir }}"
    output_format: json

  - id: spec_gate
    type: if
    condition: "{{ steps.spec_check.output.data.open > 0 }}"
    then:
      - id: approve_spec
        type: gate
        message: >-
          The spec clarifier left [NEEDS CLARIFICATION] questions that only a person can answer (why is in
          clarifications.json). Answer them in spec.md, then approve; reject stops the run.
        show_file: "{{ steps.feature.output.data.spec_file }}"
        options: [approve, reject]
        on_reject: abort
        verdict_input: spec_verdict

  # ── 2. Architect plans; a separate decision-maker settles what the architect may not ─────────────
  - id: architect
    type: prompt
    integration: "{{ inputs.integration }}"
    model: "{{ inputs.judgement_model }}"
    timeout: 2400
    prompt: >-
      You are the architect agent (agents/architect/architect.agent.md). Use its architecture-plan skill for
      {{ steps.feature.output.data.feature_dir }}. Unattended run: don't ask questions; leave open ADRs open with a
      recommendation. Reply in ≤10 lines.

  - id: plan_gate
    type: shell
    run: "python3 workflows/benefit-feature/scripts/wf.py plan-gate {{ steps.feature.output.data.feature_dir }}"
    output_format: json

  - id: decide
    type: if
    condition: "{{ steps.plan_gate.output.data.open > 0 }}"
    then:
      - id: decision_maker
        type: prompt
        integration: "{{ inputs.integration }}"
        model: "{{ inputs.judgement_model }}"
        timeout: 1800
        prompt: >-
          You are the decision-maker agent (agents/decision-maker.agent.md). Decide the open ADRs in
          {{ steps.feature.output.data.feature_dir }}/decisions/ and record them as it says. Reply in ≤10 lines.

      - id: decisions_gate
        type: shell
        run: "python3 workflows/benefit-feature/scripts/wf.py decisions-gate {{ steps.feature.output.data.feature_dir }}"
        output_format: json

      # The plan assumed the architect's recommendations; update it only where the decision-maker chose otherwise.
      - id: plan_update
        type: if
        condition: "{{ (steps.decisions_gate.output.data.plan_update_needed | length) > 0 }}"
        then:
          - id: architect_update
            type: prompt
            integration: "{{ inputs.integration }}"
            model: "{{ inputs.judgement_model }}"
            timeout: 1200
            prompt: >-
              You are the architect agent (agents/architect/architect.agent.md). The decision-maker accepted options
              other than your recommendation for {{ steps.decisions_gate.output.data.plan_update_needed }} (see
              {{ steps.feature.output.data.feature_dir }}/decisions/auto-decisions.json). Update plan.md, research.md,
              data-model.md, contracts/ and scope.json to follow those ADRs as decided. Don't change any ADR. Reply in
              ≤5 lines.

          - id: plan_recheck
            type: shell
            run: "python3 workflows/benefit-feature/scripts/wf.py plan-gate {{ steps.feature.output.data.feature_dir }}"
            output_format: json

  # ── 3. Tasks, then the quality engineer as its own agent (it judges coverage independently) ──────
  - id: tasks
    type: prompt
    integration: "{{ inputs.integration }}"
    model: "{{ inputs.coding_model }}"
    timeout: 1800
    prompt: >-
      For {{ steps.feature.output.data.feature_dir }}: follow the speckit-tasks skill to write tasks.md from the plan
      and the Accepted ADRs (each ADR's "Work this creates" becomes tasks). Tag every task with one lane and its repo:
      [contracts], [workflows], [agents], [data] or [platform-ui], then [benefit-be] or [benefit-fe]. [contracts] is
      only the shared changes the lanes build on (packages/domain, OpenAPI paths and schemas, dependencies, lockfiles,
      Makefile/Procfile), done first and alone, so a [contracts] task never depends on a lane task. Work that has to
      run after the lanes (regenerating openapi.json, running make check, walking the quickstart, cross-lane tests) is
      [qa]. Every other task touches only its lane's folders. Mention the FR IDs each task serves; every FR in the
      spec needs at least one task. Running checks, starting the stack, e2e tests or walking quickstart.md is not a
      task: the verify loop's jobs do it (check, build, e2e); write the test that proves the step instead. UPDATE MODE when tasks.md already exists (an earlier run of this feature): don't
      rewrite it. Like the speckit-converge skill, compare it with the spec, the plan and the code already on branch
      {{ steps.feature.output.data.branch }} in each repo (git -C repos/<repo> diff origin/main...HEAD): keep each [X]
      task that the code still satisfies; set back to [ ] any task whose code no longer matches the spec or plan, and
      say why on the task; add new tasks, with the next free numbers, only for what isn't built yet (new or changed
      requirements, stories and screens). Never renumber or delete a task; mark an open task whose only work is
      running checks, the stack, e2e or the quickstart [X] with "covered by the verify loop's jobs". Reply in ≤5 lines.

  - id: quality_engineer
    type: prompt
    integration: "{{ inputs.integration }}"
    model: "{{ inputs.judgement_model }}"
    timeout: 1800
    prompt: >-
      You are the quality-engineer agent (agents/quality-engineer/quality-engineer.agent.md). Use its test-strategy
      skill for {{ steps.feature.output.data.feature_dir }}: write test-plan.md, add the test-first and [qa] tasks
      to tasks.md, and check the tasks cover the plan (its step 3). If test-plan.md already exists (an earlier run),
      extend it: keep every existing case and its ID and test name, correct a case only where the spec changed it,
      and add cases, with the next free TC numbers, for the new or changed requirements. Each quickstart step
      a person would check in the browser becomes an e2e case (the verify loop's e2e job runs them), not a task. Reply in ≤10 lines.

  - id: tasks_gate
    type: shell
    run: "python3 workflows/benefit-feature/scripts/wf.py tasks-gate {{ steps.feature.output.data.feature_dir }}"
    output_format: json

  # ── 4. Build: contracts alone, then lanes in parallel, then cross-lane QA tests ───────────────────
  - id: branches
    type: shell
    run: "workflows/benefit-feature/scripts/start-branches.sh {{ steps.feature.output.data.feature_dir }}"
    timeout: 120

  # An earlier run's branch (update mode) may be behind main: merge it now, so the lanes build on what is there
  # instead of the verify loop finding the clash late. A new branch starts from origin/main, so this is skipped.
  - id: start_behind
    type: shell
    run: "python3 workflows/benefit-feature/scripts/wf.py behind {{ steps.feature.output.data.feature_dir }}"
    output_format: json

  - id: start_integrate
    type: if
    condition: "{{ (steps.start_behind.output.data.repos | length) > 0 }}"
    then:
      - id: start_integrator
        type: prompt
        integration: "{{ inputs.integration }}"
        model: "{{ inputs.judgement_model }}"
        timeout: 2400
        prompt: >-
          You are the integrator agent (agents/integrator.agent.md). Merge origin/main into branch
          {{ steps.feature.output.data.branch }} for feature {{ steps.feature.output.data.feature_dir }} in these
          repos: {{ steps.start_behind.output.data.repos }}, before the lanes build on it. Follow its steps: commit
          the feature's work, merge, resolve every textual and semantic clash (main wins unless that breaks one of
          this feature's FRs), update the plan artefacts and tasks.md where the merge changes them, record the
          resolutions in one ADR, run the checks, commit the merge. Never push. Write
          {{ steps.feature.output.data.review_dir }}/integrate.md. Reply in ≤5 lines.

  - id: contracts
    type: if
    condition: "{{ steps.tasks_gate.output.data.contracts_tasks > 0 }}"
    then:
      - id: implement_contracts
        command: speckit.implement
        integration: "{{ inputs.integration }}"
        model: "{{ inputs.coding_model }}"
        timeout: 2400
        input:
          args: >-
            Implement ONLY the [contracts] tasks in {{ steps.feature.output.data.feature_dir }}/tasks.md on branch
            {{ steps.feature.output.data.branch }}, tests first, following plan.md and the Accepted ADRs. Skip these,
            which need the lanes' code first (the QA step does them): {{ steps.tasks_gate.output.data.late_contracts }}.
            Mark the ones you did [X]. Commit nothing. Reply in ≤5 lines.

  # Lanes share one working tree per repo: each edits only its own folders and writes only under lanes/<lane>/.
  # The qa item writes the planned cross-lane tests at the same time, in the QA test folders only.
  - id: lanes
    type: fan-out
    items: "{{ steps.tasks_gate.output.data.build_items }}"
    max_concurrency: 5
    step:
      id: lane
      command: speckit.implement
      integration: "{{ inputs.integration }}"
      model: "{{ inputs.coding_model }}"
      timeout: 3600
      input:
        args: >-
          IF THIS ITEM IS "qa": the lanes are writing the code these tests exercise right now. Do the [qa] tasks
          that are tests: write the contract, integration, end-to-end and eval tests in test-plan.md, named exactly as
          planned, against the contracts (packages/domain, OpenAPI), plan.md, data-model.md and the Accepted ADRs.
          Write only in the QA test folders (benefit-be tests/integration/, tests/contract/, tests/e2e/;
          benefit-fe e2e/); never edit source code, a lane's tests or tasks.md. Don't run them yet (the code isn't
          there): the QA step and the verify loop do. Write each [qa] task that needs the lanes' code first
          (regenerating openapi.json, an eval that needs the agent, anything that runs the code) to
          {{ steps.feature.output.data.feature_dir }}/lanes/qa/blocked.md, and leave it out of done.json. Then write
          {{ steps.feature.output.data.feature_dir }}/lanes/qa/done.json as {"tasks": ["T0xx", ...]} with the tasks
          you did, and stop: the rest of this prompt is for the lanes. EVERY OTHER ITEM is a lane:
          Implement ONLY the tasks tagged [{{ item }}] (or its short name) in {{ steps.feature.output.data.feature_dir }}/tasks.md,
          on branch {{ steps.feature.output.data.branch }}, following plan.md, the Accepted ADRs in decisions/, the test
          cases in test-plan.md, and only the rule files project-rules/README.md maps to this lane. Write each test first,
          named exactly as in test-plan.md. Other lanes are editing the same repo now: edit only this lane's folders
          (project-rules/backend-architecture.md, Ownership); never edit shared files or tasks.md. If a task needs a
          change elsewhere, write it to {{ steps.feature.output.data.feature_dir }}/lanes/{{ item }}/blocked.md and go on.
          Before finishing, run only this lane's unit tests (tests/<this lane's folders>, or vitest for benefit-fe) and
          fix the code until they pass (change a test only if it contradicts test-plan.md); the full checks run later.
          Then review your own diff the way the reviewers will: the "Look for" list in agents/backend-reviewer.agent.md
          (or agents/frontend-reviewer.agent.md for benefit-fe), and every Accepted ADR's "How we verify it" that your
          lane touches. Fix what you find, adding the test that proves each fix.
          Finally write {{ steps.feature.output.data.feature_dir }}/lanes/{{ item }}/done.json as {"tasks": ["T001", ...]}.
          Commit and push nothing. Reply in ≤5 lines.

  # Only what the qa item couldn't do beside the lanes (it needed their code), and the late [contracts] tasks.
  - id: qa_remaining
    type: shell
    run: "python3 workflows/benefit-feature/scripts/wf.py qa-remaining {{ steps.feature.output.data.feature_dir }}"
    output_format: json

  - id: qa
    type: if
    condition: "{{ steps.qa_remaining.output.data.count > 0 }}"
    then:
      - id: implement_qa
        command: speckit.implement
        integration: "{{ inputs.integration }}"
        model: "{{ inputs.coding_model }}"
        timeout: 2400
        input:
          args: >-
            The lanes are done. In {{ steps.feature.output.data.feature_dir }}/tasks.md, do these [qa] tasks, which
            needed the lanes' code (see lanes/qa/blocked.md): {{ steps.qa_remaining.output.data.open_qa }}, and these
            [contracts] tasks, which had to wait for the lanes: {{ steps.qa_remaining.output.data.late_contracts }}.
            Then run the QA tests the qa item wrote against the lanes' code and fix their wiring (imports, fixtures,
            names of what the lanes built) where it doesn't match; never weaken an assertion, and where the code
            misses a planned behaviour, leave the test failing for the verify loop. Mark the tasks [X]. Commit
            nothing. Reply in ≤5 lines.

  # ── 5. Verify loop. Each round: fix what the last round found (one fixer per repo when every blocker belongs to
  #       one repo, in parallel) → merge main if it moved → the jobs start in the background → the reviews that need
  #       rerunning run meanwhile (review_mode=parallel; on_green waits for green jobs) → status. A round always ends
  #       on a verification, so no fix ships unchecked.
  - id: verify_init
    type: shell
    run: "python3 workflows/benefit-feature/scripts/wf.py verify-init {{ steps.feature.output.data.feature_dir }}"
    output_format: json

  # Keeps going while the blocking count falls (up to 6 rounds; wf.py MAX_ROUNDS) and stops early once two
  # rounds in a row make no progress. Each round has two phases: the jobs and reviews, then e2e (with the
  # integration tests) only once everything else in the round is green.
  - id: verify_loop
    type: do-while
    max_iterations: 6
    condition: "{{ steps.e2e_phase.output.data.continue }}"
    steps:
      - id: needs_fix
        type: shell
        run: "python3 workflows/benefit-feature/scripts/wf.py needs-fix {{ steps.feature.output.data.feature_dir }} {{ inputs.coding_model }} {{ inputs.judgement_model }}"
        output_format: json

      - id: maybe_fix
        type: if
        condition: "{{ steps.needs_fix.output.data.fix }}"
        then:
          # Items: "benefit-be" and/or "benefit-fe" (each fixer in its own clone, side by side), or "all" when a
          # blocker spans both repos (e2e, trace, tasks, ownership, a finding outside both).
          - id: fixes
            type: fan-out
            items: "{{ steps.needs_fix.output.data.fix_items }}"
            max_concurrency: 2
            step:
              id: fix
              type: prompt
              integration: "{{ inputs.integration }}"
              model: "{{ steps.needs_fix.output.data.fix_model }}"
              timeout: 2400
              prompt: >-
                Fix what {{ steps.feature.output.data.review_dir }}/verify.md lists as blocking, for scope "{{ item }}".
                SCOPE: "all" → everything blocking. A repo name (benefit-be or benefit-fe) → only that repo's
                blockers: its failing jobs (<repo>:check, :build, :eval), every critical or major finding in
                review/code-<repo>.md, and the compliance findings whose file is in <repo>; edit only repos/<repo>
                and never tasks.md, because another fixer is working on the other repo at the same time. Blocking
                items: failing jobs (read their logs), open tasks (do them, including the work in lanes/*/blocked.md,
                then mark them [X] in tasks.md), missing or skipped planned tests (review/trace.md), files outside
                their lane, and every critical or major finding in the review files it points to. UNDERSTAND BEFORE
                YOU FIX: for each failing or missing test, find what it is for - its test case in
                {{ steps.feature.output.data.feature_dir }}/test-plan.md (by TC ID or test name, which starts with the
                FR ID), the requirement or acceptance scenario in spec.md it proves, and any Accepted ADR it checks;
                for a test from an earlier feature, that feature's spec. State the behaviour it protects and why the
                code fails it, then change the code so it meets that requirement. Never make a test pass by weakening
                it: don't change its expected values, pins, thresholds or test name, and don't skip, xfail, delete or
                loosen it. Change a test only where it contradicts the spec, the plan or an Accepted ADR, and then
                cite the FR or ADR. A check that scans git history (gitleaks) covers this branch only: a finding in a
                commit that isn't on this branch belongs to another feature, so narrow the check's scope (gitleaks
                --log-opts=HEAD) rather than touching that file. If a failure comes from the machine, not the code (a
                missing tool, a different tool version than the pinned one, a service or login that isn't there),
                don't change code, pins or tests for it: record it as an environment problem. Write
                {{ steps.feature.output.data.review_dir }}/fixes-{{ item }}.md, one entry per failure: test or check,
                the FR/TC/ADR it proves, why it failed, what you changed (or "environment:" and what the machine
                needs). For each review finding, add or correct the test that would have caught it, so it can't come
                back. Follow the lane rule files and Accepted ADRs; keep each change in its owner's folders. Before
                finishing, rerun the tests that failed and the tests of the code you changed, plus the lint and type
                checks of each repo you changed (benefit-be: make lint typecheck; benefit-fe: pnpm lint && pnpm
                typecheck), until they pass. Don't run the full suites (make check, make verify): the verify jobs run
                them right after you. Commit nothing. Reply in ≤5 lines.

      # Main moved (another feature merged) since the branch was cut or last merged: the integrator agent merges
      # it in and resolves the clashes before this round's checks, which then test the merged code.
      - id: behind
        type: shell
        run: "python3 workflows/benefit-feature/scripts/wf.py behind {{ steps.feature.output.data.feature_dir }}"
        output_format: json

      - id: maybe_integrate
        type: if
        condition: "{{ (steps.behind.output.data.repos | length) > 0 }}"
        then:
          - id: integrate
            type: prompt
            integration: "{{ inputs.integration }}"
            model: "{{ inputs.judgement_model }}"
            timeout: 2400
            prompt: >-
              You are the integrator agent (agents/integrator.agent.md). Merge origin/main into branch
              {{ steps.feature.output.data.branch }} for feature {{ steps.feature.output.data.feature_dir }} in these
              repos: {{ steps.behind.output.data.repos }}. Follow its steps: commit the feature's work, merge, resolve
              every textual and semantic clash (main wins unless that breaks one of this feature's FRs), update the
              plan artefacts, record the resolutions in one ADR, run the checks, commit the merge. Never push.
              Write {{ steps.feature.output.data.review_dir }}/integrate.md. Reply in ≤5 lines.

      # Tests, builds, evals and the script checks start in the background and return at once;
      # nothing edits the code until jobs_wait, so the reviews below see the same code the jobs test.
      - id: jobs_start
        type: shell
        run: "python3 workflows/benefit-feature/scripts/wf.py jobs-start {{ steps.feature.output.data.feature_dir }} {{ inputs.trace_mode }}"
        output_format: json

      - id: review_list
        type: shell
        run: "python3 workflows/benefit-feature/scripts/wf.py review-list {{ steps.feature.output.data.feature_dir }} {{ inputs.review_mode }}"
        output_format: json
        timeout: 3800

      - id: reviews
        type: fan-out
        items: "{{ steps.review_list.output.data.reviews }}"
        max_concurrency: 3
        step:
          id: review
          type: prompt
          integration: "{{ inputs.integration }}"
          model: "{{ inputs.judgement_model }}"
          timeout: 1800
          prompt: >-
            Review "{{ item }}" for {{ steps.feature.output.data.feature_dir }}: "compliance" → you are the
            compliance-reviewer agent (agents/compliance-reviewer/compliance-reviewer.agent.md), using its
            compliance-review skill; "code-benefit-be" → you are the backend-reviewer agent
            (agents/backend-reviewer.agent.md); "code-benefit-fe" → you are the frontend-reviewer agent
            (agents/frontend-reviewer.agent.md). The verify jobs are running in these repos now: read the change
            only with wf.py changes / wf.py delta as your instructions say (never plain git diff, which depends on
            the index the jobs stage), and don't run tests or the stack. Write only that review's .md and .json in
            review/. Don't fix anything. Reply in ≤5 lines.

      - id: jobs_wait
        type: shell
        run: "python3 workflows/benefit-feature/scripts/wf.py jobs-wait {{ steps.feature.output.data.feature_dir }}"
        output_format: json
        timeout: 3800

      - id: verify_status
        type: shell
        run: "python3 workflows/benefit-feature/scripts/wf.py verify-status {{ steps.feature.output.data.feature_dir }} {{ inputs.review_mode }}"
        output_format: json

      # Second phase: e2e runs once, when every other job passed and no review blocks, on an isolated stack
      # (free ports, its own MongoDB and Temporal, all stopped afterwards). Until then it is pending, not a
      # blocker in itself; the final gate still needs it to pass.
      - id: e2e_phase
        type: shell
        run: "python3 workflows/benefit-feature/scripts/wf.py e2e-phase {{ steps.feature.output.data.feature_dir }} {{ inputs.review_mode }}"
        output_format: json
        timeout: 3800

  - id: final_gate
    type: shell
    run: "python3 workflows/benefit-feature/scripts/wf.py final-gate {{ steps.feature.output.data.feature_dir }}"
    output_format: json

  # ── 6. Ship: PRs, then the repos' own GitHub Actions ─────────────────────────────────────────────────
  - id: create_pr
    type: prompt
    integration: "{{ inputs.integration }}"
    model: "{{ inputs.coding_model }}"
    timeout: 900
    prompt: >-
      Use the create-pr skill for {{ steps.feature.output.data.feature_dir }}, branch {{ steps.feature.output.data.branch }},
      for every repo with changes. Starting this run is the user's approval to push; don't ask again. Open draft PRs
      (--draft); the workflow marks them ready once GitHub Actions is green. Fill the PR template with the
      FR IDs covered, the results in review/verify.md (including its Warnings section) and review/trace.md, and a
      "Decided automatically - please review" section listing each entry in decisions/auto-decisions.json (ADR,
      option chosen, the architect's recommendation, revisit-if) and any amendment suggested, and each spec
      question in {{ steps.feature.output.data.feature_dir }}/clarifications.json that the spec clarifier answered (question, answer, revisit-if). If the
      API contract changed, open the benefit-be PR first and link the two. Write
      {{ steps.feature.output.data.review_dir }}/prs.json as {"<repo>": "<PR URL>"}. Reply with the URLs.

  # GitHub Actions loop: wait for CI; if a check fails, a fix step reads its log, fixes, pushes to the
  # feature branch (never main) and CI runs again, up to 3 times. Green drafts are marked ready for review.
  - id: ci_loop
    type: do-while
    max_iterations: 3
    condition: "{{ steps.ci.output.data.failing > 0 }}"
    steps:
      - id: ci_needs_fix
        type: shell
        run: "python3 workflows/benefit-feature/scripts/wf.py ci-needs-fix {{ steps.feature.output.data.feature_dir }}"
        output_format: json

      - id: maybe_ci_fix
        type: if
        condition: "{{ steps.ci_needs_fix.output.data.fix }}"
        then:
          - id: ci_fix
            type: prompt
            integration: "{{ inputs.integration }}"
            model: "{{ inputs.coding_model }}"
            timeout: 2400
            prompt: >-
              GitHub Actions failed on the PRs in {{ steps.feature.output.data.review_dir }}/prs.json; the failing
              checks and their log tails are in {{ steps.feature.output.data.review_dir }}/ci.md. Work in each repo
              under repos/ on branch {{ steps.feature.output.data.branch }}. Find the cause (CI differs from local:
              no .env, and services such as MongoDB only in the integration job), reproduce it locally where you can
              (integration and e2e: `make verify-stack` in repos/benefit-be, which runs them on its own free ports and
              stops its stack; never start a stack on the default ports, and stop any process you started before you
              finish), and fix it the way the lane rules and Accepted ADRs require, adding the test that would have caught
              it. Run make check in each repo you changed. Then commit with a conventional message ending with the
              line "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>", and push with
              git push origin {{ steps.feature.output.data.branch }}. Never push to main, force-push or skip hooks.
              Reply in ≤5 lines.

      - id: ci
        type: shell
        run: "python3 workflows/benefit-feature/scripts/wf.py ci-wait {{ steps.feature.output.data.feature_dir }}"
        output_format: json
        timeout: 5600

  - id: ci_gate
    type: shell
    run: "python3 workflows/benefit-feature/scripts/wf.py ci-gate {{ steps.feature.output.data.feature_dir }}"
    output_format: json

  # Last: nothing this run started keeps listening (review/ports.md). run.sh runs the same check after the engine
  # exits, so a run that stops early is cleaned up too.
  - id: ports_freed
    type: shell
    run: "python3 workflows/benefit-feature/scripts/wf.py ports-freed {{ steps.feature.output.data.feature_dir }}"
    output_format: json
