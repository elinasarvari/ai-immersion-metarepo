schema_version: "1.0"
workflow:
  id: "benefit-feature"
  name: "Benefits Case feature"
  version: "0.8.0"
  author: "ai-immersion-metarepo"
  description: >-
    From an existing spec to draft PRs, each AI step a separate agent: architect plan → decision-maker settles
    open ADRs → tasks → quality engineer's test plan and QA tasks → contracts → lanes in parallel →
    QA tests → verify loop (fix → tests, builds and script checks in parallel → reviews in parallel, only on
    green and only where something changed) → draft PRs → GitHub Actions. People are asked only when
    automation can't decide.

requires:
  speckit_version: ">=1.0.0"
  integrations:
    any: ["claude"]

inputs:
  feature:
    type: string
    required: true
    prompt: "Spec to build: its number (e.g. 003) or folder (specs/003-name)"
  integration: {type: string, default: "auto"}
  pr_mode:
    type: string
    default: "draft"
    prompt: "draft = when everything passes, push and open draft PRs, marked ready for review once GitHub Actions is green; ask = approve before pushing (PRs open ready for review); none = stop before pushing"
  trace_mode:
    type: string
    default: "strict"
    prompt: "strict = fail if a planned test is missing; warn = report only"
  # Models per step: judgement (plan, decisions, test design, reviews) vs following a written plan (tasks,
  # code, fixes, PRs). Any value `claude --model` accepts: an alias (opus, sonnet) or a full model ID.
  judgement_model: {type: string, default: "opus"}
  coding_model: {type: string, default: "sonnet"}
  decision_mode:
    type: string
    default: "auto"
    prompt: "auto = the decision-maker agent decides open ADRs (review them in the PR); ask = you decide at a gate"
  # Gate answers for runs without a terminal. One per gate; set only on resume, after a person decided.
  spec_verdict: {type: string, default: ""}
  decision_verdict: {type: string, default: ""}
  pr_verdict: {type: string, default: ""}

# Run:     specify workflow run workflows/benefit-feature/workflow.yml -i feature=003
# Checks:  one `wf.py` gate after each planning stage; every check on the code runs inside the verify loop, so
#          the fix step can repair it. A failed gate stops the run: fix, then `specify workflow resume <id>`.
# AI steps: each one is a separate agent session (agents/). 6 fixed (architect, tasks, quality engineer, contracts,
#           QA, PR) + the decision-maker if an ADR is open (+ an architect update if it chose differently) + 1 per lane
#           + per verify round: the reviews that need rerunning and one fix.

steps:
  # ── 1. Pick up the spec ───────────────────────────────────────────────────────────────────────────
  - id: sync
    type: shell
    run: "skills/sync-repos/sync-repos.sh"
    timeout: 300

  - id: feature
    type: shell
    run: "python3 workflows/benefit-feature/scripts/wf.py prepare {{ inputs.feature }} {{ inputs.pr_mode }} {{ inputs.trace_mode }} {{ inputs.decision_mode }}"
    output_format: json

  - id: spec_questions
    type: if
    condition: "{{ steps.feature.output.data.open > 0 }}"
    then:
      - id: approve_spec
        type: gate
        message: "The spec has open [NEEDS CLARIFICATION] questions. Answer them in spec.md, then approve; reject stops the run."
        show_file: "{{ steps.feature.output.data.spec_file }}"
        options: [approve, reject]
        on_reject: abort
        verdict_input: spec_verdict

  # ── 2. Architect plans; a separate decision-maker settles what the architect may not ─────────────
  - id: architect
    type: prompt
    integration: "{{ inputs.integration }}"
    model: "{{ inputs.judgement_model }}"
    timeout: 2400
    prompt: >-
      You are the architect agent (agents/architect/architect.agent.md). Use its architecture-plan skill for
      {{ steps.feature.output.data.feature_dir }}. Unattended run: don't ask questions; leave open ADRs open with a
      recommendation. Reply in ≤10 lines.

  - id: plan_gate
    type: shell
    run: "python3 workflows/benefit-feature/scripts/wf.py plan-gate {{ steps.feature.output.data.feature_dir }}"
    output_format: json

  - id: decide
    type: if
    condition: "{{ steps.plan_gate.output.data.open > 0 and inputs.decision_mode == 'auto' }}"
    then:
      - id: decision_maker
        type: prompt
        integration: "{{ inputs.integration }}"
        model: "{{ inputs.judgement_model }}"
        timeout: 1800
        prompt: >-
          You are the decision-maker agent (agents/decision-maker.agent.md). Decide the open ADRs in
          {{ steps.feature.output.data.feature_dir }}/decisions/ and record them as it says. Reply in ≤10 lines.

      - id: decisions_gate
        type: shell
        run: "python3 workflows/benefit-feature/scripts/wf.py decisions-gate {{ steps.feature.output.data.feature_dir }}"
        output_format: json

      # The plan assumed the architect's recommendations; update it only where the decision-maker chose otherwise.
      - id: plan_update
        type: if
        condition: "{{ (steps.decisions_gate.output.data.plan_update_needed | length) > 0 }}"
        then:
          - id: architect_update
            type: prompt
            integration: "{{ inputs.integration }}"
            model: "{{ inputs.judgement_model }}"
            timeout: 1200
            prompt: >-
              You are the architect agent (agents/architect/architect.agent.md). The decision-maker accepted options
              other than your recommendation for {{ steps.decisions_gate.output.data.plan_update_needed }} (see
              {{ steps.feature.output.data.feature_dir }}/decisions/auto-decisions.json). Update plan.md, research.md,
              data-model.md, contracts/ and scope.json to follow those ADRs as decided. Don't change any ADR. Reply in
              ≤5 lines.

          - id: plan_recheck
            type: shell
            run: "python3 workflows/benefit-feature/scripts/wf.py plan-gate {{ steps.feature.output.data.feature_dir }}"
            output_format: json

  - id: decision_questions
    type: if
    condition: "{{ steps.plan_gate.output.data.open > 0 and inputs.decision_mode == 'ask' }}"
    then:
      - id: approve_decisions
        type: gate
        message: >-
          Some decisions are yours, listed first in decisions/README.md. Answer each (ask the assistant to record it
          in the ADR) or accept the ADR's fallback, then approve; reject stops the run.
        show_file: "{{ steps.feature.output.data.feature_dir }}/decisions/README.md"
        options: [approve, reject]
        on_reject: abort
        verdict_input: decision_verdict

  # ── 3. Tasks, then the quality engineer as its own agent (it judges coverage independently) ──────
  - id: tasks
    type: prompt
    integration: "{{ inputs.integration }}"
    model: "{{ inputs.coding_model }}"
    timeout: 1800
    prompt: >-
      For {{ steps.feature.output.data.feature_dir }}: follow the speckit-tasks skill to write tasks.md from the plan
      and the Accepted ADRs (each ADR's "Work this creates" becomes tasks). Tag every task with one lane and its repo:
      [contracts], [workflows], [agents], [data] or [platform-ui], then [benefit-be] or [benefit-fe]. [contracts] is
      only the shared changes the lanes build on (packages/domain, OpenAPI paths and schemas, dependencies, lockfiles,
      Makefile/Procfile), done first and alone, so a [contracts] task never depends on a lane task. Work that has to
      run after the lanes (regenerating openapi.json, running make check, walking the quickstart, cross-lane tests) is
      [qa]. Every other task touches only its lane's folders. Mention the FR IDs each task serves; every FR in the
      spec needs at least one task. Reply in ≤5 lines.

  - id: quality_engineer
    type: prompt
    integration: "{{ inputs.integration }}"
    model: "{{ inputs.judgement_model }}"
    timeout: 1800
    prompt: >-
      You are the quality-engineer agent (agents/quality-engineer/quality-engineer.agent.md). Use its test-strategy
      skill for {{ steps.feature.output.data.feature_dir }}: write test-plan.md, add the test-first and [qa] tasks
      to tasks.md, and check the tasks cover the plan (its step 3). Reply in ≤10 lines.

  - id: tasks_gate
    type: shell
    run: "python3 workflows/benefit-feature/scripts/wf.py tasks-gate {{ steps.feature.output.data.feature_dir }}"
    output_format: json

  # ── 4. Build: contracts alone, then lanes in parallel, then cross-lane QA tests ───────────────────
  - id: branches
    type: shell
    run: "workflows/benefit-feature/scripts/start-branches.sh {{ steps.feature.output.data.feature_dir }}"
    timeout: 120

  - id: contracts
    type: if
    condition: "{{ steps.tasks_gate.output.data.contracts_tasks > 0 }}"
    then:
      - id: implement_contracts
        command: speckit.implement
        integration: "{{ inputs.integration }}"
        model: "{{ inputs.coding_model }}"
        timeout: 2400
        input:
          args: >-
            Implement ONLY the [contracts] tasks in {{ steps.feature.output.data.feature_dir }}/tasks.md on branch
            {{ steps.feature.output.data.branch }}, tests first, following plan.md and the Accepted ADRs. Skip these,
            which need the lanes' code first (the QA step does them): {{ steps.tasks_gate.output.data.late_contracts }}.
            Mark the ones you did [X]. Commit nothing. Reply in ≤5 lines.

  # Lanes share one working tree per repo: each edits only its own folders and writes only under lanes/<lane>/.
  - id: lanes
    type: fan-out
    items: "{{ steps.tasks_gate.output.data.lanes }}"
    max_concurrency: 4
    step:
      id: lane
      command: speckit.implement
      integration: "{{ inputs.integration }}"
      model: "{{ inputs.coding_model }}"
      timeout: 3600
      input:
        args: >-
          Implement ONLY the tasks tagged [{{ item }}] (or its short name) in {{ steps.feature.output.data.feature_dir }}/tasks.md,
          on branch {{ steps.feature.output.data.branch }}, following plan.md, the Accepted ADRs in decisions/, the test
          cases in test-plan.md, and only the rule files project-rules/README.md maps to this lane. Write each test first,
          named exactly as in test-plan.md. Other lanes are editing the same repo now: edit only this lane's folders
          (project-rules/backend-architecture.md, Ownership); never edit shared files or tasks.md. If a task needs a
          change elsewhere, write it to {{ steps.feature.output.data.feature_dir }}/lanes/{{ item }}/blocked.md and go on.
          Before finishing, run only this lane's unit tests (tests/<this lane's folders>, or vitest for benefit-fe) and
          fix the code until they pass (change a test only if it contradicts test-plan.md); the full checks run later.
          Then review your own diff the way the reviewers will: the "Look for" list in agents/backend-reviewer.agent.md
          (or agents/frontend-reviewer.agent.md for benefit-fe), and every Accepted ADR's "How we verify it" that your
          lane touches. Fix what you find, adding the test that proves each fix.
          Finally write {{ steps.feature.output.data.feature_dir }}/lanes/{{ item }}/done.json as {"tasks": ["T001", ...]}.
          Commit and push nothing. Reply in ≤5 lines.

  - id: qa
    type: if
    condition: "{{ steps.tasks_gate.output.data.qa_tasks > 0 }}"  # includes late [contracts] tasks
    then:
      - id: implement_qa
        command: speckit.implement
        integration: "{{ inputs.integration }}"
        model: "{{ inputs.coding_model }}"
        timeout: 2400
        input:
          args: >-
            Implement ONLY the [qa] tasks in {{ steps.feature.output.data.feature_dir }}/tasks.md: the contract,
            integration, end-to-end and eval tests in test-plan.md, named exactly as planned. Also do these [contracts]
            tasks, which had to wait for the lanes: {{ steps.tasks_gate.output.data.late_contracts }}. Mark them [X].
            Commit nothing. Reply in ≤5 lines.

  # ── 5. Verify loop. Each round: fix what the last round found → every check in parallel → reviews (only on
  #       green, only those with no result, still blocking, or whose repo changed) → status. A round always
  #       ends on a verification, so no fix ships unchecked.
  - id: verify_init
    type: shell
    run: "python3 workflows/benefit-feature/scripts/wf.py verify-init {{ steps.feature.output.data.feature_dir }}"
    output_format: json

  # Keeps going while the blocking count falls (up to 6 rounds; wf.py MAX_ROUNDS) and stops early once two
  # rounds in a row make no progress. Later fixes switch to the judgement model.
  - id: verify_loop
    type: do-while
    max_iterations: 6
    condition: "{{ steps.verify_status.output.data.continue }}"
    steps:
      - id: needs_fix
        type: shell
        run: "python3 workflows/benefit-feature/scripts/wf.py needs-fix {{ steps.feature.output.data.feature_dir }} {{ inputs.coding_model }} {{ inputs.judgement_model }}"
        output_format: json

      - id: maybe_fix
        type: if
        condition: "{{ steps.needs_fix.output.data.blocking > 0 }}"
        then:
          - id: fix
            type: prompt
            integration: "{{ inputs.integration }}"
            model: "{{ steps.needs_fix.output.data.fix_model }}"
            timeout: 2400
            prompt: >-
              Fix everything {{ steps.feature.output.data.review_dir }}/verify.md lists as blocking: failing jobs (read
              their logs), open tasks (do them, including the work in lanes/*/blocked.md, then mark them [X] in tasks.md),
              missing or skipped planned tests (review/trace.md), files outside their lane, and every critical or major
              finding in the review files it points to. For each finding, add or correct the test that would have caught
              it, so it can't come back. Follow the lane rule files and Accepted ADRs; keep each change in its owner's
              folders. Run make check in each repo you changed before finishing. Commit nothing. Reply in ≤5 lines.

      - id: job_list
        type: shell
        run: "python3 workflows/benefit-feature/scripts/wf.py jobs {{ steps.feature.output.data.feature_dir }} {{ inputs.trace_mode }}"
        output_format: json

      - id: run_jobs
        type: fan-out
        items: "{{ steps.job_list.output.data.jobs }}"
        max_concurrency: 4
        step:
          id: run_job
          type: shell
          run: "python3 workflows/benefit-feature/scripts/wf.py job {{ steps.feature.output.data.feature_dir }} {{ item }}"
          output_format: json
          timeout: 3700

      - id: review_list
        type: shell
        run: "python3 workflows/benefit-feature/scripts/wf.py review-list {{ steps.feature.output.data.feature_dir }}"
        output_format: json

      # Empty while a job fails, so a red round spends no review tokens.
      - id: reviews
        type: fan-out
        items: "{{ steps.review_list.output.data.reviews }}"
        max_concurrency: 3
        step:
          id: review
          type: prompt
          integration: "{{ inputs.integration }}"
          model: "{{ inputs.judgement_model }}"
          timeout: 1800
          prompt: >-
            Review "{{ item }}" for {{ steps.feature.output.data.feature_dir }}: "compliance" → you are the
            compliance-reviewer agent (agents/compliance-reviewer/compliance-reviewer.agent.md), using its
            compliance-review skill; "code-benefit-be" → you are the backend-reviewer agent
            (agents/backend-reviewer.agent.md); "code-benefit-fe" → you are the frontend-reviewer agent
            (agents/frontend-reviewer.agent.md). Write only that review's .md and .json in review/. Don't fix
            anything. Reply in ≤5 lines.

      - id: verify_status
        type: shell
        run: "python3 workflows/benefit-feature/scripts/wf.py verify-status {{ steps.feature.output.data.feature_dir }}"
        output_format: json

  - id: final_gate
    type: shell
    run: "python3 workflows/benefit-feature/scripts/wf.py final-gate {{ steps.feature.output.data.feature_dir }}"
    output_format: json

  # ── 6. Ship: PRs, then the repos' own GitHub Actions ─────────────────────────────────────────────────
  - id: pr_approval
    type: if
    condition: "{{ inputs.pr_mode == 'ask' }}"
    then:
      - id: approve_pr
        type: gate
        message: "Everything passed. Review review/verify.md, review/trace.md and the diff, then approve to push and open PRs."
        show_file: "{{ steps.feature.output.data.review_dir }}/verify.md"
        options: [approve, reject]
        on_reject: abort
        verdict_input: pr_verdict

  - id: ship
    type: if
    condition: "{{ inputs.pr_mode != 'none' }}"
    then:
      - id: create_pr
        type: prompt
        integration: "{{ inputs.integration }}"
        model: "{{ inputs.coding_model }}"
        timeout: 900
        prompt: >-
          Use the create-pr skill for {{ steps.feature.output.data.feature_dir }}, branch {{ steps.feature.output.data.branch }},
          for every repo with changes. Starting this run with pr_mode={{ inputs.pr_mode }} is the user's approval to push;
          don't ask again. pr_mode "draft" → draft PRs (--draft; the workflow marks them ready once GitHub Actions is
          green); "ask" → PRs ready for review (no --draft). Fill the PR template with the
          FR IDs covered, the results in review/verify.md (including its Warnings section) and review/trace.md, and a
          "Decided automatically - please review" section listing each entry in decisions/auto-decisions.json (ADR,
          option chosen, the architect's recommendation, revisit-if) and any amendment suggested. If the
          API contract changed, open the benefit-be PR first and link the two. Write
          {{ steps.feature.output.data.review_dir }}/prs.json as {"<repo>": "<PR URL>"}. Reply with the URLs.

      # GitHub Actions loop: wait for CI; if a check fails, a fix step reads its log, fixes, pushes to the
      # feature branch (never main) and CI runs again, up to 3 times. Green drafts are marked ready for review.
      - id: ci_loop
        type: do-while
        max_iterations: 3
        condition: "{{ steps.ci.output.data.failing > 0 }}"
        steps:
          - id: ci_needs_fix
            type: shell
            run: "python3 workflows/benefit-feature/scripts/wf.py ci-needs-fix {{ steps.feature.output.data.feature_dir }}"
            output_format: json

          - id: maybe_ci_fix
            type: if
            condition: "{{ steps.ci_needs_fix.output.data.fix }}"
            then:
              - id: ci_fix
                type: prompt
                integration: "{{ inputs.integration }}"
                model: "{{ inputs.judgement_model }}"
                timeout: 2400
                prompt: >-
                  GitHub Actions failed on the PRs in {{ steps.feature.output.data.review_dir }}/prs.json; the failing
                  checks and their log tails are in {{ steps.feature.output.data.review_dir }}/ci.md. Work in each repo
                  under repos/ on branch {{ steps.feature.output.data.branch }}. Find the cause (CI differs from local:
                  no .env, and services such as MongoDB only in the integration job), reproduce it locally where you can,
                  and fix it the way the lane rules and Accepted ADRs require, adding the test that would have caught
                  it. Run make check in each repo you changed. Then commit with a conventional message ending with the
                  line "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>", and push with
                  git push origin {{ steps.feature.output.data.branch }}. Never push to main, force-push or skip hooks.
                  Reply in ≤5 lines.

          - id: ci
            type: shell
            run: "python3 workflows/benefit-feature/scripts/wf.py ci-wait {{ steps.feature.output.data.feature_dir }} {{ inputs.pr_mode }}"
            output_format: json
            timeout: 5600

      - id: ci_gate
        type: shell
        run: "python3 workflows/benefit-feature/scripts/wf.py ci-gate {{ steps.feature.output.data.feature_dir }}"
        output_format: json
